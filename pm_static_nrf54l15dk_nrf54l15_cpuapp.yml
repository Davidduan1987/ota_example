mcuboot:
  address: 0x0
  end_address: 0x20000
  region: flash_primary
  size: 0x20000

mcuboot_pad:
  address: 0x20000
  end_address: 0x21000
  region: flash_primary
  size: 0x1000

# Code partition
app:
  address: 0x21000
  end_address: 0x148000
  region: flash_primary
  size: 0x127000

mcuboot_primary:
  address: 0x20000
  end_address: 0x148000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  size: 0x128000
  span: *id001

mcuboot_primary_app:
  address: 0x21000
  end_address: 0x148000
  orig_span: &id002
  - app
  region: flash_primary
  size: 0x127000
  span: *id002

settings_storage:
  address: 0x148000
  end_address: 0x14B000
  region: flash_primary
  size: 0x3000

# Ring storage partition, 200K
ring_storage:
  address: 0x14B000
  end_address: 0x17D000
  device: mx25r64
  region: flash_primary
  size: 0x32000


# External flash declaration
external_flash:
  address: 0x0
  end_address: 0x800000
  device: mx25r64
  region: external_flash
  size: 0x800000

# OTA image partition, same size as mcuboot_primary
mcuboot_secondary:
  address: 0x0
  end_address: 0x128000
  device: mx25r64
  region: external_flash
  size: 0x128000

# User data partition
ido_storage_partition:
  address: 0x128000
  end_address: 0x800000
  device: mx25r64
  region: external_flash
  size: 0x6D8000